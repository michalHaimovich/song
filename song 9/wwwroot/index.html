<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Song</title>
    <link rel="stylesheet" href="css/site.css?v=1" />
</head>

<body class="modern-body">
    <script>
        const currentToken = sessionStorage.getItem('token');
        if (!currentToken) {
            window.location.href = 'i.html';
        }
    </script>

    <h2 id="user-greeting" class="modern-header"></h2>

    <h1>My Songs</h1>
    <div class="button-group" style="margin-bottom: 15px;">
        <button onclick="showMyProfile()" style="cursor: pointer; padding: 8px 15px; margin-right: 10px; border-radius: 5px; border: 1px solid #ccc; background-color: #d3d3d3;">
            👤 My Profile
        </button>
        <a id="admin-link" href="./User.html" style="display:none; text-decoration: none;">
            <button style="cursor: pointer; padding: 8px 15px; border-radius: 5px; border: 1px solid #ccc; background-color: #e9ecef;">
                👨‍💼 Users Management
            </button>
        </a>
    </div>
    <hr>

    <div id="notifications-wrapper" style="margin-bottom: 20px; max-width: 500px;">

        <button onclick="toggleNotifications()"
            style="margin-bottom: 10px; cursor: pointer; padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; background-color: #e9ecef;">
            הצג/הסתר היסטוריית פעולות 🔔
        </button>

        <div id="notifications-panel"
            style="border: 1px solid #ccc; padding: 15px; background-color: #f8f9fa; border-radius: 8px; display: block;">
            <h3 style="margin-top: 0;">Recent Activity</h3>

            <ol id="notifications-list" style="padding-left: 25px; margin: 0; max-height: 200px; overflow-y: auto;">
                <li style="color: #666; font-style: italic; list-style-type: none;">No recent activity...</li>
            </ol>
        </div>
    </div>

    <h3>Add New Song</h3>
    <form id="add-form" class="modern-form">
        <input type="text" id="add-name" placeholder="Song Name" required>
        <input type="text" id="add-composer" placeholder="Composer" required>
        <input type="number" id="add-userId" placeholder="User ID" style="display:none;">
        <input type="submit" value="Add Song">
    </form>

    <div id="editForm" style="display:none;" class="modern-form">
        <h3>Edit Song</h3>
        <form id="edit-form">
            <input type="hidden" id="edit-id">
            <input type="text" id="edit-name" placeholder="Song Name" required>
            <input type="text" id="edit-composer" placeholder="Composer" required>
            <input type="number" id="edit-userId" placeholder="User ID" style="display:none;">
            <input type="submit" value="Save">
            <a href="#" onclick="closeInput(); return false;" aria-label="Close">&#10006;</a>
        </form>
    </div>

    <div id="profileModal" class="modern-modal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div class="modal-content" style="background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); max-width: 400px; width: 90%;">
            <h3 style="margin-top: 0;">My Profile</h3>
            <div id="profile-content" style="margin-bottom: 20px; line-height: 1.8;">
                <p><strong>ID:</strong> <span id="profile-id"></span></p>
                <p><strong>Name:</strong> <span id="profile-name"></span></p>
                <p><strong>Role:</strong> <span id="profile-role"></span></p>
            </div>
            <div id="profile-edit" style="display:none; margin-bottom: 20px;">
                <h4>Edit Profile</h4>
                <input type="text" id="edit-profile-name" placeholder="Name" class="modern-input">
                <input type="password" id="edit-profile-password" placeholder="New Password (leave empty to keep current)" class="modern-input">
                <button onclick="saveProfile()" class="modern-button">Save</button>
                <button onclick="cancelEditProfile()" class="modern-button">Cancel</button>
            </div>
            <button onclick="closeProfileModal()" class="modern-button">Close</button>
            <button onclick="editProfile()" class="modern-button">Edit</button>
        </div>
    </div>

    <p id="counter"></p>

    <table class="modern-table" border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Song Name</th>
                <th>Composer</th>
                <th>User ID</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="musics"></tbody>
    </table>
    <hr>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="js/SongSite.js" asp-append-version="true"></script>
    <script type="text/javascript">
        initPage();
    </script>
</body>

</html>

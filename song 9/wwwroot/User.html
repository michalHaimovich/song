<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management</title>
    <link rel="stylesheet" href="css/site.css?v=1">
</head>
<body class="modern-body">
    <script>
        if (sessionStorage.getItem('token') == null) {
            window.location.href = 'i.html';
        }
    </script>
    
    <h2 id="user-greeting" class="modern-header"></h2>
    <div class="button-group" style="margin-bottom: 15px;">
        <button onclick="showMyProfile()" style="cursor: pointer; padding: 8px 15px; margin-right: 10px; border-radius: 5px; border: 1px solid #ccc; background-color: #d3d3d3;">
            👤 My Profile
        </button>
        <a href="index.html" style="text-decoration: none;">
            <button style="cursor: pointer; padding: 8px 15px; border-radius: 5px; border: 1px solid #ccc; background-color: #e9ecef;">
                🎵 Back to Songs
            </button>
        </a>
    </div>
    <hr>
    <h3>Add User</h3>
    <form action="javascript:void(0);" method="POST" onsubmit="addItem()" style="display:none;" id="addForm" class="modern-form">
        <input type="text" id="add-name" placeholder="User Name" required>
        <input type="text" id="add-password" placeholder="Password" required>
        <input type="text" id="add-role" placeholder="Role (admin/user)" style="display:none;">
        <input type="submit" value="Add">
    </form>

    <div id="editForm" style="display: none;" class="modern-form">
        <h3>Edit User</h3>
        <form action="javascript:void(0);" onsubmit="updateItem()">
            <div id="edit-id-display" style="font-weight: bold; margin-bottom: 10px;"></div>
            <input type="hidden" id="edit-id"> 
            
            <input type="text" id="edit-name" placeholder="Name" required>
            <input type="text" id="edit-password" placeholder="Password" required>
            <input type="text" id="edit-role" placeholder="Role" style="display: none;">
            
            <input type="submit" value="Save">
            <a onclick="closeInput()" aria-label="Close" style="cursor: pointer;">&#10006;</a>
        </form>
    </div>

    <table class="modern-table">
        <tr>
            <th>ID</th> <th>Name</th> 
            <th style="display:none;" id="role-header">Role</th> <th>Password</th> 
            <th>Edit</th>
            <th style="display:none;" id="delete-header">Delete</th>
        </tr>
        <tbody id="musics"></tbody>
    </table>

    <br>    
    <div id="profileModal" class="modern-modal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div class="modal-content" style="background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); max-width: 400px; width: 90%;">
            <h3 style="margin-top: 0;">My Profile</h3>
            <div id="profile-content" style="margin-bottom: 20px; line-height: 1.8;">
                <p><strong>ID:</strong> <span id="profile-id"></span></p>
                <p><strong>Name:</strong> <span id="profile-name"></span></p>
                <p><strong>Role:</strong> <span id="profile-role"></span></p>
            </div>
            <div id="profile-edit" style="display:none; margin-bottom: 20px;">
                <h4>Edit Profile</h4>
                <input type="text" id="edit-profile-name" placeholder="Name" class="modern-input">
                <input type="password" id="edit-profile-password" placeholder="New Password (leave empty to keep current)" class="modern-input">
                <button onclick="saveProfile()" class="modern-button">Save</button>
                <button onclick="cancelEditProfile()" class="modern-button">Cancel</button>
            </div>
            <button onclick="closeProfileModal()" class="modern-button">Close</button>
            <button onclick="editProfile()" class="modern-button">Edit</button>
        </div>
    </div>
    
    <script src="js/UserSite.js" asp-append-version="true"></script>
    <script type="text/javascript">
        getItems();
    </script>
</body>
</html>
